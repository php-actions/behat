name: Behat (php-actions)
description: Run your Behat tests in your Github Actions.

inputs:
  version:
    description: What version of Behat to use
    default: latest
    required: false

  php_version:
    description: What version of PHP to use
    default: latest
    required: false

  php_extensions:
    description: Space separated list of extensions to configure with the PHP build
    required: false

  vendored_behat_path:
    description: Path to a vendored behat binary
    required: false

  app_command:
    description: Command to run in a temporary app server container before executing Behat
    required: false

  app_image:
    description: Docker image to use for the temporary app server container
    required: false

  app_port:
    description: Host port exposed by the temporary app server container
    required: false
    default: "8000"

  chrome_image:
    description: Docker image to use for the temporary Chrome container
    required: false
    default: registry.gitlab.com/behat-chrome/docker-chrome-headless:latest

  chrome_port:
    description: Host port exposed by the temporary Chrome DevTools endpoint
    required: false
    default: "9222"

  base_url:
    description: Override base_url inside the Behat config used by the action
    required: false

  chrome_api_url:
    description: Override Chrome api_url inside the Behat config used by the action
    required: false

  startup_timeout:
    description: Number of seconds to wait for temporary services to become ready
    required: false
    default: "20"

  config:
    description: Configuration file location
    required: false

  paths:
    description: Optional path(s) to exclude
    required: false

  suite:
    description: Only execute a specific suite
    required: false

  format:
    description: How to format tests output (pretty/progress/junit)
    required: false
    default: pretty

  out:
    description: Write format output to a file/directory instead of STDOUT
    required: false

  name:
    description: Only executeCall the feature elements which match part of the given name or regex
    required: false

  tags:
    description: Only executeCall the features or scenarios with tags matching tag filter expression
    required: false

  role:
    description: Only executeCall the features with actor role matching a wildcard
    required: false

  definitions:
    description: Print all available step definitions (l to list, i to show extended info, 'needle' to find specific definitions)
    required: false

  memory_limit:
    description: Memory limit for tests
    required: false

  args:
    description: Extra arguments to pass to the behat binary
    required: false

runs:
  using: "composite"
  steps:
    - env:
        ACTION_TOKEN: ${{ github.token }}
        ACTION_VERSION: ${{ inputs.version }}
        ACTION_PHP_VERSION: ${{ inputs.php_version }}
        ACTION_BEHAT_PATH: ${{ inputs.vendored_behat_path }}
        ACTION_APP_COMMAND: ${{ inputs.app_command }}
        ACTION_APP_IMAGE: ${{ inputs.app_image }}
        ACTION_APP_PORT: ${{ inputs.app_port }}
        ACTION_CHROME_IMAGE: ${{ inputs.chrome_image }}
        ACTION_CHROME_PORT: ${{ inputs.chrome_port }}
        ACTION_BASE_URL: ${{ inputs.base_url }}
        ACTION_CHROME_API_URL: ${{ inputs.chrome_api_url }}
        ACTION_STARTUP_TIMEOUT: ${{ inputs.startup_timeout }}
        ACTION_PHP_EXTENSIONS: ${{ inputs.php_extensions }}
        ACTION_CONFIG: ${{ inputs.config }}
        ACTION_PATHS: ${{ inputs.paths }}
        ACTION_SUITE: ${{ inputs.suite }}
        ACTION_FORMAT: ${{ inputs.format }}
        ACTION_OUT: ${{ inputs.out }}
        ACTION_NAME: ${{ inputs.name }}
        ACTION_TAGS: ${{ inputs.tags }}
        ACTION_ROLE: ${{ inputs.role }}
        ACTION_DEFINITIONS: ${{ inputs.definitions }}
        ACTION_MEMORY_LIMIT: ${{ inputs.memory_limit }}
        ACTION_ARGS: ${{ inputs.args }}
      id: behat_run
      run: |
        set -e
        bash <(curl -s https://raw.githubusercontent.com/php-actions/php-build/v2/php-build.bash) behat
        ${{ github.action_path }}/behat-action.bash
      shell: bash

branding:
  icon: 'check-square'
  color: 'purple'
